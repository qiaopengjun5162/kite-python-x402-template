[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "kite-python-x402-template"
version = "0.1.0"
description = "Paid API behind x402 payments settled on the Kite chain"
requires-python = ">=3.12"
dependencies = [
    "x402[evm,fastapi]",
    "uvicorn[standard]",
    "httpx",
    "python-dotenv",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "RUF100"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
exclude = ["test/"]
