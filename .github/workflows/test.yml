name: test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.14"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install just
        uses: extractions/setup-just@v2
      - name: Install dependencies
        run: |
          just install
          pip install -r requirements-dev.txt
      - name: Run tests
        run: |
          export PAY_TO=0x0000000000000000000000000000000000000000
          export UPSTREAM_URL=https://api.open-meteo.com
          export KITE_NETWORK=testnet
          export PRICE_USD=0.001
          just test
